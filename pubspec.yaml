name: opentrack
description: "快递查询 Android 应用 - 通过快递100 API 查询快递状态"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 状态管理
  flutter_riverpod: ^2.6.1

  # HTTP 请求
  dio: ^5.7.0

  # 本地存储
  shared_preferences: ^2.3.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # 后台任务
  workmanager: ^0.7.0

  # 本地通知
  flutter_local_notifications: ^18.0.1

  # MD5 签名
  crypto: ^3.0.6

  # JSON 序列化
  json_annotation: ^4.9.0

  # UUID 生成
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # 代码生成
  hive_generator: ^2.0.1
  build_runner: ^2.4.14
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/
